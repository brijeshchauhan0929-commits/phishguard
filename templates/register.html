{% extends "base.html" %}

{% block title %}Create Account - PHISHGUARD{% endblock %}

{% block content %}
<section class="section" style="padding-top: 60px; padding-bottom: 90px;">
  <div class="container container-narrow" style="max-width: 500px;">
    
    <div class="checks-card" style="padding: 40px;">
      <div class="text-center" style="margin-bottom: 28px;">
        <div class="shield-icon-badge mx-auto" style="margin-bottom: 16px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <h2 style="font-size: 1.8rem; font-weight: 800; color: var(--primary); margin-bottom: 6px;">
          Create Defense Profile
        </h2>
        <p style="font-size: 0.92rem; color: var(--text-muted);">
          Register to track your threat assessments and earn certification badges.
        </p>
      </div>

      <form action="{{ url_for('register') }}" method="POST">
        <div style="margin-bottom: 18px;">
          <label style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px; color: var(--primary);">
            Full Name:
          </label>
          <input type="text" name="name" class="scanner-input-field"
                 placeholder="e.g. Chauhan Brijesh"
                 style="width: 100%; padding: 12px 16px; border: 1.5px solid var(--border-light); border-radius: var(--radius-md); background: var(--bg-light);" required>
        </div>

        <div style="margin-bottom: 18px;">
          <label style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px; color: var(--primary);">
            Email Address:
          </label>
          <input type="email" name="email" class="scanner-input-field"
                 placeholder="name@organization.com"
                 style="width: 100%; padding: 12px 16px; border: 1.5px solid var(--border-light); border-radius: var(--radius-md); background: var(--bg-light);" required>
        </div>

        <div style="margin-bottom: 24px;">
          <label style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px; color: var(--primary);">
            Password:
          </label>
          <input type="password" name="password" class="scanner-input-field"
                 placeholder="Minimum 6 characters"
                 style="width: 100%; padding: 12px 16px; border: 1.5px solid var(--border-light); border-radius: var(--radius-md); background: var(--bg-light);" required>
        </div>

        <button type="submit" class="btn btn-accent btn-lg" style="width: 100%;">
          Create Account &rarr;
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Already registered? <a href="{{ url_for('login') }}" style="color: var(--primary-accent); font-weight: 700;">Sign In</a>
      </div>
    </div>

  </div>
</section>
{% endblock %}
