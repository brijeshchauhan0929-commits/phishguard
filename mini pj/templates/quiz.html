{% extends "base.html" %}

{% block title %}Interactive Cybersecurity Quiz - PHISHGUARD{% endblock %}

{% block content %}
<section class="section" style="padding-top: 50px; padding-bottom: 80px;">
  <div class="container container-narrow" id="quizApp">
    
    <!-- Top Quiz Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <a href="{{ url_for('awareness_view') }}" class="btn btn-outline btn-sm">
        &larr; Back to Awareness Hub
      </a>
      <div id="quizCounter" style="font-weight: 700; font-size: 0.95rem; color: var(--primary);">
        Loading Assessment...
      </div>
    </div>

    <!-- Main Quiz Card -->
    <div class="quiz-card">
      <!-- Progress Bar Container -->
      <div class="quiz-progress-bar-container">
        <div class="quiz-progress-fill" id="quizProgressFill" style="width: 0%;"></div>
      </div>

      <!-- Dynamic Question & Scenario Content Injected by quiz.js -->
      <div id="quizCardContent">
        <div class="text-center" style="padding: 40px 0;">
          <div class="pulse-dot" style="margin: 0 auto 16px auto; width: 14px; height: 14px;"></div>
          <p style="color: var(--text-muted); font-weight: 600;">Initializing PhishGuard Knowledge Engine...</p>
        </div>
      </div>
    </div>

  </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
  window.PHISHGUARD_USER_NAME = "{{ session.get('user_name', 'Chauhan Brijesh Ramayan') }}";
</script>
<script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
{% endblock %}
